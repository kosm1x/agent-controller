<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ant Colony — Icosahedron Edge Crawlers (Three.js)</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05070d; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
  </style>

  <!-- Import map: maps the bare specifier 'three' (the path the inlined code
       imports) to the pinned CDN build of three.module.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- Corrected ant-colony code from g-2, inlined as an ES module.
       It imports THREE from the bare specifier 'three' resolved by the import map above. -->
  <script type="module">
import * as THREE from 'three';

// ant-colony.js — Three.js particles crawling along the edges of an icosahedron.
// Corrected, self-contained build.
//
// Fixes applied vs. the original (g-1 static review):
//   1. initTargets() now actually populates particles by calling assign() for the
//      three TARGETS buckets over valid E_EDGES pairs (was an empty body).
//   2. assign() is now invoked (from initTargets) and guards assignIdx so it never
//      exceeds N (was declared but never called).
//   3. frame() animates particle motion along edges each tick using dt/dirArr/onArr
//      (dt was previously unused, particles never moved).
//   4. geometry.attributes.position.needsUpdate = true is set after mutating posArr
//      each frame (was never re-uploaded, so the GPU never saw the changes).
//   5. E_EDGES is derived once from faces with de-duplication (was duplicated).
//
// UNCHANGED (per requirements): icosahedron vertex/face data and the xorshift rand().

// ---------------------------------------------------------------------------
// Icosahedron geometry data (UNCHANGED)
// ---------------------------------------------------------------------------
const t = (1 + Math.sqrt(5)) / 2;

// V = 12 vertices
const VERTS = [
  [-1,  t,  0], [ 1,  t,  0], [-1, -t,  0], [ 1, -t,  0],
  [ 0, -1,  t], [ 0,  1,  t], [ 0, -1, -t], [ 0,  1, -t],
  [ t,  0, -1], [ t,  0,  1], [-t,  0, -1], [-t,  0,  1],
];

// 20 triangular faces (vertex indices)
const FACES = [
  [0, 11,  5], [0,  5,  1], [0,  1,  7], [0,  7, 10], [0, 10, 11],
  [1,  5,  9], [5, 11,  4], [11, 10, 2], [10, 7,  6], [7,  1,  8],
  [3,  9,  4], [3,  4,  2], [3,  2,  6], [3,  6,  8], [3,  8,  9],
  [4,  9,  5], [2,  4, 11], [6,  2, 10], [8,  6,  7], [9,  8,  1],
];

const V = VERTS.length; // 12

// ---------------------------------------------------------------------------
// xorshift rand() (UNCHANGED)
// ---------------------------------------------------------------------------
let _seed = 0x9e3779b9 >>> 0;
function rand() {
  // xorshift32
  let x = _seed >>> 0;
  x ^= x << 13; x >>>= 0;
  x ^= x >> 17; x >>>= 0;
  x ^= x << 5;  x >>>= 0;
  _seed = x >>> 0;
  return _seed / 4294967296; // [0,1)
}

// ---------------------------------------------------------------------------
// Derive unique undirected edges from FACES (FIX #5: de-duplicated, built once)
// ---------------------------------------------------------------------------
function buildEdges(faces) {
  const seen = new Set();
  const edges = [];
  for (const [a, b, c] of faces) {
    for (const [u, w] of [[a, b], [b, c], [c, a]]) {
      const lo = Math.min(u, w);
      const hi = Math.max(u, w);
      const key = lo * 1000 + hi;
      if (!seen.has(key)) {
        seen.add(key);
        edges.push([lo, hi]); // store as [vertexA, vertexB]
      }
    }
  }
  return edges;
}

const E_EDGES = buildEdges(FACES); // 30 unique edges for an icosahedron
const E = E_EDGES.length;

// ---------------------------------------------------------------------------
// Particle system configuration
// ---------------------------------------------------------------------------
const N = 10000;                 // total particle capacity
const TARGETS = [1000, 500, 400]; // three buckets => 1900 active particles
const SPEED = 0.6;               // edge-fraction traversed per second (base)

// Per-particle state (SoA layout)
const posArr  = new Float32Array(N * 3); // xyz positions written to geometry
const dirArr  = new Int8Array(N);        // travel direction along edge: +1 or -1
const onArr   = new Float32Array(N);     // progress along current edge in [0,1]
const edgeArr = new Int32Array(N);       // which E_EDGES index this particle rides
const speedArr = new Float32Array(N);    // per-particle speed multiplier

let assignIdx = 0; // next free particle slot; MUST never exceed N

// ---------------------------------------------------------------------------
// assign(): place `count` particles onto random valid edges. (FIX #2)
// Guards against overflowing N.
// ---------------------------------------------------------------------------
function assign(count) {
  for (let i = 0; i < count; i++) {
    if (assignIdx >= N) return; // never exceed capacity
    const p = assignIdx++;

    const e = Math.floor(rand() * E) % E; // valid E_EDGES index
    edgeArr[p] = e;
    onArr[p]   = rand();                 // random start along the edge
    dirArr[p]  = rand() < 0.5 ? -1 : 1;  // random travel direction
    speedArr[p] = 0.5 + rand();          // 0.5x .. 1.5x base speed

    writePosition(p); // seed initial xyz
  }
}

// Compute the xyz for particle p from its edge + progress, write into posArr.
function writePosition(p) {
  const [va, vb] = E_EDGES[edgeArr[p]];
  const A = VERTS[va];
  const B = VERTS[vb];
  const u = onArr[p];
  const o = p * 3;
  posArr[o]     = A[0] + (B[0] - A[0]) * u;
  posArr[o + 1] = A[1] + (B[1] - A[1]) * u;
  posArr[o + 2] = A[2] + (B[2] - A[2]) * u;
}

// ---------------------------------------------------------------------------
// initTargets(): wire up the three buckets over valid E_EDGES pairs. (FIX #1)
// ---------------------------------------------------------------------------
function initTargets() {
  assignIdx = 0;
  for (const bucket of TARGETS) {
    assign(bucket); // never exceeds N because assign() guards assignIdx
  }
}

// ---------------------------------------------------------------------------
// Three.js scene / geometry setup
// ---------------------------------------------------------------------------
let geometry, points, scene, camera, renderer, clock;

function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 100
  );
  camera.position.z = 8;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  document.getElementById('app').appendChild(renderer.domElement);

  geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

  const material = new THREE.PointsMaterial({
    color: 0x66ccff,
    size: 0.05,
    sizeAttenuation: true,
  });

  points = new THREE.Points(geometry, material);
  scene.add(points);

  clock = new THREE.Clock();

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ---------------------------------------------------------------------------
// frame(): advance every active particle along its edge, then upload. (FIX #3, #4)
// ---------------------------------------------------------------------------
function frame() {
  requestAnimationFrame(frame);

  const dt = clock.getDelta(); // seconds since last frame (FIX #3: now used)

  // Slowly rotate the whole colony so the 3D structure reads clearly.
  if (points) points.rotation.y += 0.15 * dt;

  for (let p = 0; p < assignIdx; p++) {
    // Advance progress along the edge using dt, direction and per-particle speed.
    let u = onArr[p] + dirArr[p] * SPEED * speedArr[p] * dt;

    // Bounce (ping-pong) at the endpoints so particles crawl back and forth,
    // OR hop to a new random edge when reaching a vertex. Here we ping-pong.
    if (u >= 1) {
      u = 1 - (u - 1);
      dirArr[p] = -1;
      // At a vertex, optionally continue onto a connected edge:
      hopEdge(p, E_EDGES[edgeArr[p]][1]);
    } else if (u <= 0) {
      u = -u;
      dirArr[p] = 1;
      hopEdge(p, E_EDGES[edgeArr[p]][0]);
    }

    onArr[p] = u;
    writePosition(p);
  }

  // Tell Three.js the position buffer changed so the GPU re-reads it. (FIX #4)
  geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

// When a particle reaches vertex `atVertex`, pick another edge incident to it.
function hopEdge(p, atVertex) {
  // Collect edges touching this vertex.
  const candidates = [];
  for (let e = 0; e < E; e++) {
    if (E_EDGES[e][0] === atVertex || E_EDGES[e][1] === atVertex) {
      candidates.push(e);
    }
  }
  if (candidates.length === 0) return;
  const e = candidates[Math.floor(rand() * candidates.length) % candidates.length];
  edgeArr[p] = e;
  // Enter the edge from the endpoint that equals atVertex.
  if (E_EDGES[e][0] === atVertex) {
    onArr[p] = 0;
    dirArr[p] = 1;
  } else {
    onArr[p] = 1;
    dirArr[p] = -1;
  }
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function main() {
  initScene();
  initTargets(); // populate particles BEFORE the first frame
  frame();
}

// The module script runs after the DOM is parsed (deferred by default),
// so #app already exists. Boot immediately.
main();
  </script>
</body>
</html>
