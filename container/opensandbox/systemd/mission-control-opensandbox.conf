# Drop-in for mission-control.service — sandbox backend selection (2026-08-16).
# Install: /etc/systemd/system/mission-control.service.d/opensandbox.conf
# Then: sudo systemctl daemon-reload && sudo systemctl restart mission-control && ./mc-ctl sandboxes
# Rollback: remove/comment the SANDBOX_BACKEND line (docker path is untouched) + restart.
# One key at a time. SANDBOX_EGRESS_ALLOW stays commented until the observation week is over
# (docs/planning/opensandbox-adoption.md §5).
[Service]
EnvironmentFile=-/etc/opensandbox/api.env
Environment=SANDBOX_BACKEND=opensandbox
# Environment=SANDBOX_EGRESS_ALLOW=*.anthropic.com,github.com,api.github.com,*.githubusercontent.com,registry.npmjs.org
