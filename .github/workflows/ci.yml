name: ci

# The full test suite (6,600+ tests) previously had ONLY one gate: a machine-local,
# unversioned pre-commit hook that self-skips on non-.ts changes and OOMs this VPS under
# load. Any second machine, fresh clone, or `git -c core.hooksPath=` bypassed it entirely.
# This job is the enforced, reproducible gate. Vitest is sharded to stay under the memory
# ceiling that makes a single `vitest run` OOM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: tsc (test files)
        # A test-file pattern in an exclude list would make this pass
        # vacuously, so the step also asserts the test files are in the program.
        run: |
          npx tsc -p tsconfig.test.json
          files=$(npx tsc -p tsconfig.test.json --listFilesOnly)
          n=$(printf '%s\n' "$files" | grep -c '\.test\.ts$' || true)
          s=$(printf '%s\n' "$files" | grep -c '/scripts/.*\.test\.ts$' || true)
          if ! test "$n" -gt 500 || ! test "$s" -gt 0; then
            echo "tsconfig.test.json type-checks only $n test files ($s under scripts/; expected > 500 and > 0): an exclude or a dropped include makes this gate pass vacuously" >&2
            exit 1
          fi
      - name: build (npm run build + artifact check)
        # Without this step the compile emit, the asset copies and the docs build
        # first run on the operator's deploy. The checks mirror package.json
        # "build" one line per copy (a new copy there needs a line here) plus the
        # entry file the unit starts; test -e follows the pm-shim symlinks.
        run: |
          npm run build
          fail=0
          missing() { echo "npm run build did not produce $1 ($2)" >&2; fail=1; }
          test -s dist/index.js || missing dist/index.js "service entry: node dist/index.js"
          test -s dist/db/schema.sql || missing dist/db/schema.sql "cp src/db/schema.sql"
          test -s dist/tuning/seed-cases.json || missing dist/tuning/seed-cases.json "cp src/tuning/seed-cases.json"
          test -x dist/tools/builtin/pm-shim/pm-shim.sh || missing dist/tools/builtin/pm-shim/pm-shim.sh "cp -a src/tools/builtin/pm-shim, executable"
          for f in src/tools/builtin/pm-shim/*; do test -e "dist/tools/builtin/pm-shim/${f##*/}" || missing "dist/tools/builtin/pm-shim/${f##*/}" "cp -a src/tools/builtin/pm-shim"; done
          test -s public/docs/index.html || missing public/docs/index.html "scripts/build-docs.sh"
          test -s public/docs/llms.txt || missing public/docs/llms.txt "scripts/build-docs.sh"
          test -s public/docs/llms-full.txt || missing public/docs/llms-full.txt "scripts/build-docs.sh"
          exit $fail

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: vitest (shard ${{ matrix.shard }}/3)
        # A test file is excluded here only when one of its cases needs
        # something a stock runner lacks: a host binary (Chromium, edge-tts,
        # ffmpeg), a host folder outside the checkout and the temp folder, or
        # the host's core count. Each is excluded by name; every other video
        # test gates CI. The excluded files still run in the host's commit
        # check, which runs the whole suite whenever TypeScript is staged.
        run: >
          npx vitest run --shard=${{ matrix.shard }}/3 --reporter=dot
          --exclude "src/video/composer.test.ts"
          --exclude "src/video/html-renderer.test.ts"
          --exclude "src/video/overlay-e2e.test.ts"
          --exclude "src/video/tts.test.ts"
        env:
          CI: "true"
